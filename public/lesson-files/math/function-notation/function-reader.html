<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Function reader — Mr. Cruz · The Lehman YABC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="/lesson-kit/lesson.css" />
<style>
  :root { --in: #b5471f; --out: #1f4fb5; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1000px; }
  .lay { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 760px) { .lay { grid-template-columns: minmax(0, 1fr); } }
  .board { padding: 8px; }
  .board svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
  .grid line { stroke: #ebe8e0; stroke-width: 1; }
  .axis { stroke: #121212; stroke-width: 1.8; }
  .tick { font: 500 11px var(--font-body); fill: #5f5c55; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .curve { fill: none; stroke: #121212; stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
  .guide { stroke-width: 2; stroke-dasharray: 5 5; }
  .handle { cursor: grab; outline: none; }
  .handle:focus-visible circle.ring, .handle.is-drag circle.ring { stroke: #121212; stroke-width: 3; }
  .tag { font: 800 14px var(--font-display); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; margin: 0 0 12px; }
  .seg button { font: 700 14px var(--font-display); padding: 9px 14px; border: 0; background: #fff; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .chips button { font: 600 13.5px var(--font-body); padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; }
  .chips button[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }
  .rule { font: 700 17px var(--font-display); margin: 0 0 10px; }
  .big { font: 900 clamp(30px, 4.2vw, 44px)/1.05 var(--font-display); letter-spacing: -.02em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .big .i { color: var(--in); } .big .o { color: var(--out); }
  .say { font-size: 15.5px; margin: 0 0 12px; }
  .dr { border-top: 1.5px solid var(--line); padding-top: 12px; margin-top: 12px; font-size: 15px; }
  .dr p { margin: 0 0 6px; }
  .dr b.i { color: var(--in); } .dr b.o { color: var(--out); }
  label.tog { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; font-size: 15px; cursor: pointer; }
</style>
</head>
<body class="math">
<div class="wrap">
  <p class="kicker">Math · Functions · Interactive</p>
  <h1>Function reader</h1>
  <p class="lede">Two questions you can ask a graph. <b style="color:var(--in)">Plug in</b>: pick an input and read the output. <b style="color:var(--out)">Solve</b>: pick an output and find every input that makes it. Drag the dot or the line, or tab to it and use the arrow keys.</p>

  <div class="lay">
    <div class="card pop board"><svg id="svg" viewBox="0 0 488 524" aria-labelledby="gt"><title id="gt">Graph</title></svg></div>
    <div>
      <div class="seg" role="group" aria-label="Question">
        <button type="button" data-mode="plug" aria-pressed="true">Plug in: f(a)</button>
        <button type="button" data-mode="solve" aria-pressed="false">Solve: f(x) = b</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Function"></div>
      <p class="rule" id="rule"></p>
      <div class="big" id="big" aria-live="polite"></div>
      <p class="say" id="say"></p>
      <label class="tog"><input type="checkbox" id="dr" /> Show domain and range</label>
      <div class="dr" id="drbox" hidden></div>
    </div>
  </div>
</div>

<script>
(function () {
  const INF = Infinity;
  const PRESETS = [
    { id: 'quad', chip: 'x² − 2x − 3', name: 'f', rule: 'f(x) = x² − 2x − 3', f: (x) => x * x - 2 * x - 3, dom: [-INF, INF], ran: [-4, INF], domText: 'all real numbers — any x can go in', ranText: 'y ≥ −4 — the outputs start at −4 and go up forever', a: 3, b: 5 },
    { id: 'abs', chip: '|x − 1| − 2', name: 'f', rule: 'f(x) = |x − 1| − 2', f: (x) => Math.abs(x - 1) - 2, dom: [-INF, INF], ran: [-2, INF], domText: 'all real numbers', ranText: 'y ≥ −2', a: -1, b: 1 },
    { id: 'sqrt', chip: '√(x + 3)', name: 'f', rule: 'f(x) = √(x + 3)', f: (x) => Math.sqrt(x + 3), dom: [-3, INF], ran: [0, INF], domText: 'x ≥ −3 — below −3 you would be taking the square root of a negative', ranText: 'y ≥ 0 — a square root is never negative', a: 1, b: 2 },
    { id: 'line', chip: '2x − 1', name: 'f', rule: 'f(x) = 2x − 1', f: (x) => 2 * x - 1, dom: [-INF, INF], ran: [-INF, INF], domText: 'all real numbers', ranText: 'all real numbers — a slanted line hits every height', a: 2, b: 3 },
    { id: 'path', chip: 'g: a path', name: 'g', rule: 'g: no formula — read it off the graph', pts: [[-3, 1], [-1, 3], [1, -1], [4, 2]], dom: [-3, 4], ran: [-1, 3], domText: '−3 ≤ x ≤ 4 — the graph starts at x = −3 and stops at x = 4', ranText: '−1 ≤ y ≤ 3 — lowest point −1, highest point 3', a: -1, b: 1 },
  ];
  PRESETS.forEach((p) => {
    if (p.pts) p.f = (x) => {
      const q = p.pts;
      if (x < q[0][0] || x > q[q.length - 1][0]) return NaN;
      for (let i = 0; i < q.length - 1; i++) if (x >= q[i][0] && x <= q[i + 1][0]) return q[i][1] + ((q[i + 1][1] - q[i][1]) * (x - q[i][0])) / (q[i + 1][0] - q[i][0]);
      return NaN;
    };
  });

  const X0 = -5, X1 = 7, Y0 = -5, Y1 = 8, U = 36, P = 28;
  const W = (X1 - X0) * U + 2 * P, H = (Y1 - Y0) * U + 2 * P;
  const px = (x) => P + (x - X0) * U, py = (y) => P + (Y1 - y) * U;
  const ux = (sx) => X0 + (sx - P) / U, uy = (sy) => Y1 - (sy - P) / U;
  const r1 = (n) => Math.round(n * 10) / 10;
  const M = '−';
  const fmt = (v) => { const r = Math.round(v * 100) / 100; return (r < 0 ? M : '') + String(Math.abs(r)); };

  const S = { preset: PRESETS[0], mode: 'plug', a: 3, b: 5, dr: false };
  const svg = document.getElementById('svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const $ = (id) => document.getElementById(id);

  function inDom(x) { const d = S.preset.dom; return x >= d[0] - 1e-9 && x <= d[1] + 1e-9; }
  function clampA(x) {
    const d = S.preset.dom;
    return Math.max(Math.max(d[0], X0 + 0.5), Math.min(Math.min(d[1], X1 - 0.5), x));
  }
  function roots(b) {
    const f = S.preset.f, d = S.preset.dom, out = [];
    const lo = Math.max(d[0], X0 - 2), hi = Math.min(d[1], X1 + 2);
    let prev = null;
    for (let i = 0; ; i++) {
      const x = Math.round((lo + i * 0.001) * 1000) / 1000;
      if (x > hi + 1e-9) break;
      const v = f(x) - b;
      if (Number.isNaN(v)) { prev = null; continue; }
      if (Math.abs(v) < 1e-9) out.push(x);
      else if (prev && prev.v * v < 0 && Math.abs(prev.v) > 1e-9) out.push(prev.x + (x - prev.x) * (prev.v / (prev.v - v)));
      prev = { x: x, v: v };
    }
    return out.map((x) => Math.round(x * 100) / 100).filter((x, i, arr) => i === 0 || Math.abs(x - arr[i - 1]) > 0.02);
  }

  function draw() {
    const p = S.preset, f = p.f;
    let h = '<title id="gt">Graph of ' + p.rule + '</title><defs><clipPath id="clip"><rect x="' + P + '" y="' + P + '" width="' + (W - 2 * P) + '" height="' + (H - 2 * P) + '"/></clipPath></defs>';
    // grid + axes
    h += '<g class="grid">';
    for (let x = X0; x <= X1; x++) h += '<line x1="' + px(x) + '" y1="' + P + '" x2="' + px(x) + '" y2="' + (H - P) + '"/>';
    for (let y = Y0; y <= Y1; y++) h += '<line x1="' + P + '" y1="' + py(y) + '" x2="' + (W - P) + '" y2="' + py(y) + '"/>';
    h += '</g><line class="axis" x1="' + P + '" y1="' + py(0) + '" x2="' + (W - P) + '" y2="' + py(0) + '"/><line class="axis" x1="' + px(0) + '" y1="' + P + '" x2="' + px(0) + '" y2="' + (H - P) + '"/>';
    for (let x = X0; x <= X1; x++) if (x) h += '<text class="tick" x="' + px(x) + '" y="' + (py(0) + 15) + '" text-anchor="middle">' + fmt(x) + '</text>';
    for (let y = Y0; y <= Y1; y++) if (y) h += '<text class="tick" x="' + (px(0) - 7) + '" y="' + (py(y) + 4) + '" text-anchor="end">' + fmt(y) + '</text>';
    h += '<text class="tick" x="' + (W - P + 4) + '" y="' + (py(0) + 4) + '">x</text><text class="tick" x="' + (px(0) + 5) + '" y="' + (P - 8) + '">y</text>';

    // domain + range bands
    if (S.dr) {
      const d0 = Math.max(p.dom[0], X0), d1 = Math.min(p.dom[1], X1), r0 = Math.max(p.ran[0], Y0), rr1 = Math.min(p.ran[1], Y1);
      // the shadows sit right on the axes: domain on the x-axis, range on the y-axis
      h += '<line x1="' + px(d0) + '" y1="' + py(0) + '" x2="' + px(d1) + '" y2="' + py(0) + '" stroke="var(--in)" stroke-width="11" stroke-linecap="round" opacity=".4"/>';
      h += '<line x1="' + px(0) + '" y1="' + py(r0) + '" x2="' + px(0) + '" y2="' + py(rr1) + '" stroke="var(--out)" stroke-width="11" stroke-linecap="round" opacity=".4"/>';
    }

    // the curve
    let pts = [];
    if (p.pts) pts = p.pts.map((q) => q);
    else {
      const lo = Math.max(p.dom[0], X0 - 1), hi = Math.min(p.dom[1], X1 + 1);
      for (let x = lo; x <= hi + 1e-9; x += 0.02) { const y = f(x); if (!Number.isNaN(y)) pts.push([x, y]); }
      if (p.dom[0] > -INF) pts.unshift([p.dom[0], f(p.dom[0])]);
    }
    h += '<g clip-path="url(#clip)"><polyline class="curve" points="' + pts.map((q) => r1(px(q[0])) + ',' + r1(py(q[1]))).join(' ') + '"/></g>';
    if (p.dom[0] > -INF) h += '<circle cx="' + px(p.dom[0]) + '" cy="' + py(f(p.dom[0])) + '" r="5" fill="#121212"/>';
    if (p.dom[1] < INF) h += '<circle cx="' + px(p.dom[1]) + '" cy="' + py(f(p.dom[1])) + '" r="5" fill="#121212"/>';

    let big = '', say = '';
    if (S.mode === 'plug') {
      const a = S.a, y = f(a), X = px(a), Y = py(Math.max(Y0 + 0.25, Math.min(Y1 - 0.25, y))); // off-window outputs keep the dot on the edge, still grabbable
      const on = y >= Y0 && y <= Y1;
      h += '<line class="guide" x1="' + X + '" y1="' + py(0) + '" x2="' + X + '" y2="' + Y + '" stroke="var(--in)"/>';
      if (on) h += '<line class="guide" x1="' + X + '" y1="' + Y + '" x2="' + px(0) + '" y2="' + Y + '" stroke="var(--out)"/>';
      h += '<text class="tag" x="' + X + '" y="' + (py(0) + (y >= 0 ? 32 : -12)) + '" text-anchor="middle" fill="var(--in)">' + fmt(a) + '</text>';
      if (on) h += '<text class="tag" x="' + (px(0) + (a >= 0 ? -10 : 10)) + '" y="' + (Y - 8) + '" text-anchor="' + (a >= 0 ? 'end' : 'start') + '" fill="var(--out)">' + fmt(y) + '</text>';
      h += '<g class="handle" id="hd" tabindex="0" role="slider" aria-label="Input a" aria-valuenow="' + a + '" aria-valuetext="a = ' + fmt(a) + ', ' + p.name + '(a) = ' + fmt(y) + '" transform="translate(' + r1(X) + ' ' + r1(Y) + ')"><circle class="ring" r="11" fill="var(--in)" stroke="#fff" stroke-width="3"/></g>';
      big = p.name + '(<span class="i">' + fmt(a) + '</span>) = <span class="o">' + fmt(y) + '</span>';
      say = 'Input <b style="color:var(--in)">' + fmt(a) + '</b> goes in, output <b style="color:var(--out)">' + fmt(y) + '</b> comes out. So the point (' + fmt(a) + ', ' + fmt(y) + ') is on the graph.' + (on ? '' : ' (That point is off the top of this window.)');
    } else {
      const b = S.b, xs = roots(b), Y = py(b);
      h += '<line x1="' + P + '" y1="' + Y + '" x2="' + (W - P) + '" y2="' + Y + '" stroke="var(--out)" stroke-width="2.5"/>';
      xs.forEach((x) => {
        if (x < X0 || x > X1) return;
        h += '<line class="guide" x1="' + px(x) + '" y1="' + Y + '" x2="' + px(x) + '" y2="' + py(0) + '" stroke="var(--in)"/>';
        h += '<circle cx="' + px(x) + '" cy="' + Y + '" r="6.5" fill="var(--in)" stroke="#fff" stroke-width="2.5"/>';
        h += '<text class="tag" x="' + px(x) + '" y="' + (py(0) + (b >= 0 ? 32 : -12)) + '" text-anchor="middle" fill="var(--in)">' + fmt(x) + '</text>';
      });
      h += '<g class="handle" id="hd" tabindex="0" role="slider" aria-label="Output b" aria-valuenow="' + b + '" aria-valuetext="b = ' + fmt(b) + '" transform="translate(' + (P + 14) + ' ' + r1(Y) + ')"><circle class="ring" r="11" fill="var(--out)" stroke="#fff" stroke-width="3"/></g>';
      big = p.name + '(x) = <span class="o">' + fmt(b) + '</span>';
      if (!xs.length) say = 'No input works — the graph never reaches height <b style="color:var(--out)">' + fmt(b) + '</b>. The line misses the graph completely.';
      else say = 'when x = ' + xs.map((x) => '<b style="color:var(--in)">' + fmt(x) + '</b>').join(' or ') + '. ' + (xs.length === 1 ? 'One input makes that output.' : xs.length + ' different inputs make that same output — that is allowed.');
    }
    svg.innerHTML = h;
    $('rule').textContent = p.rule;
    $('big').innerHTML = big;
    $('say').innerHTML = say;
    $('drbox').hidden = !S.dr;
    $('drbox').innerHTML = '<p><b class="i">Domain</b> (every input that works): ' + p.domText + '.</p><p><b class="o">Range</b> (every output you get): ' + p.ranText + '.</p><p class="mute" style="font-size:13.5px">Look at the shadows: the domain is the graph squashed down onto the x-axis, the range is the graph squashed sideways onto the y-axis.</p>';
  }

  /* chips */
  $('chips').innerHTML = PRESETS.map((p, i) => '<button type="button" data-p="' + i + '" aria-pressed="' + (i === 0) + '">' + p.chip + '</button>').join('');
  $('chips').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    S.preset = PRESETS[Number(b.dataset.p)]; S.a = S.preset.a; S.b = S.preset.b;
    $('chips').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    draw();
  });
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    S.mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    draw();
  }));
  $('dr').addEventListener('change', () => { S.dr = $('dr').checked; draw(); });

  /* drag + keys */
  let drag = false;
  const toSvg = (ev) => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const setFromPointer = (ev) => {
    const q = toSvg(ev);
    if (S.mode === 'plug') S.a = clampA(Math.round(ux(q.x) * 2) / 2);
    else S.b = Math.max(Y0, Math.min(Y1, Math.round(uy(q.y) * 2) / 2));
    draw();
  };
  svg.addEventListener('pointerdown', (ev) => {
    // grab the dot, or tap anywhere on the graph to move it there
    drag = true;
    setFromPointer(ev);
    ev.preventDefault();
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* some browsers refuse; moves still work */ }
  });
  svg.addEventListener('pointermove', (ev) => { if (drag) setFromPointer(ev); });
  const end = () => { if (!drag) return; drag = false; const h = document.getElementById('hd'); if (h) h.focus({ preventScroll: true }); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('keydown', (ev) => {
    if (!ev.target.closest('#hd')) return;
    const step = ev.shiftKey ? 0.1 : 0.5;
    let d = 0;
    if (S.mode === 'plug') d = ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? step : ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' ? -step : 0;
    else d = ev.key === 'ArrowUp' || ev.key === 'ArrowRight' ? step : ev.key === 'ArrowDown' || ev.key === 'ArrowLeft' ? -step : 0;
    if (!d) return;
    ev.preventDefault();
    if (S.mode === 'plug') S.a = clampA(Math.round((S.a + d) * 10) / 10);
    else S.b = Math.max(Y0, Math.min(Y1, Math.round((S.b + d) * 10) / 10));
    draw();
    const h = document.getElementById('hd'); if (h) h.focus({ preventScroll: true });
  });

  draw();
})();
</script>
</body>
</html>
