<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Angle explorer — Mr. Cruz · The Lehman YABC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="/lesson-kit/lesson.css" />
<style>
  :root { --a1: #b5471f; --a2: #1f4fb5; --a3: #1f6f45; --a4: #8a5a00; }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .modes button { font: 700 14px var(--font-display); padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: #fff; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .stage { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  .board { padding: 8px; }
  .board svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
  .ln { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .handle { cursor: grab; outline: none; }
  .handle circle { stroke: #fff; stroke-width: 3; }
  .handle:focus-visible circle, .handle.is-drag circle { stroke: var(--ink); stroke-width: 3; }
  .handle.is-drag { cursor: grabbing; }
  .lab { font: 800 17px var(--font-display); paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
  .arc { fill: none; stroke-width: 3.5; transition: opacity .15s; }
  .wedge { transition: opacity .15s; }
  .dim { opacity: .18; }
  .facts h2 { margin: 0 0 8px; font-size: 18px; }
  .fact { display: block; width: 100%; text-align: left; font: 500 15.5px/1.4 var(--font-body); padding: 10px 12px; margin: 0 0 8px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--ink); }
  .fact:hover { border-color: var(--ink); }
  .fact[aria-pressed="true"] { border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .fact b { font-family: var(--font-display); }
  .fact .nm { display: block; font: 700 11.5px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-bottom: 2px; }
  .fact .eq { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }
  .dare { margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--acc); background: #fff; border-radius: 0 10px 10px 0; font-size: 15px; }
  .row.tools { margin-top: 10px; gap: 8px; }
  .row.tools label { font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body class="math">
<div class="wrap">
  <p class="kicker">Math · Geometry · Interactive</p>
  <h1>Angle explorer</h1>
  <p class="lede">Drag the dots, or tab to a dot and use the arrow keys. The angles change as you drag, but the relationships on the right stay true every time.</p>

  <div class="modes" role="group" aria-label="What to explore">
    <button type="button" data-mode="cross" aria-pressed="true">Two crossing lines</button>
    <button type="button" data-mode="right" aria-pressed="false">A split right angle</button>
    <button type="button" data-mode="around" aria-pressed="false">Around a point</button>
  </div>

  <div class="stage">
    <div class="card pop board"><svg id="svg" viewBox="0 0 640 400" aria-labelledby="svg-title"><title id="svg-title">Angle figure</title></svg></div>
    <div class="facts">
      <h2>Always true</h2>
      <div id="facts"></div>
      <p class="dare" id="dare"></p>
      <div class="row tools">
        <button type="button" class="btn sm" id="shuffle">Shuffle</button>
        <label id="hide-wrap"><input type="checkbox" id="hide" /> Hide ∠3 and ∠4</label>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const svg = document.getElementById('svg');
  const factsEl = document.getElementById('facts');
  const dareEl = document.getElementById('dare');
  const hideEl = document.getElementById('hide');
  const C = { a1: getComputedStyle(document.documentElement).getPropertyValue('--a1').trim() || '#b5471f', a2: '#1f4fb5', a3: '#1f6f45', a4: '#8a5a00' };
  const O = [320, 200];
  const rad = (d) => (d * Math.PI) / 180;
  const at = (o, r, a) => [o[0] + r * Math.cos(rad(a)), o[1] - r * Math.sin(rad(a))];
  const norm = (a) => ((a % 360) + 360) % 360;
  const r1 = (n) => Math.round(n * 10) / 10;

  const S = {
    mode: 'cross',
    cross: { a: 20, b: 75 },          // direction of line A and line B (degrees)
    right: { t: 34 },                 // the ray inside the right angle
    around: { r: [15, 105, 200, 290] },
    focus: null,                      // which fact is highlighted
    hide: false,
  };

  /* ---------- geometry per mode ---------- */
  function crossAngles() {
    const a = norm(S.cross.a) % 180, b = norm(S.cross.b) % 180;
    const x = norm(b - a) % 180; // ∠1, from line A to line B
    return { a, one: x, two: 180 - x };
  }

  function draw() {
    let h = '<title id="svg-title">Angle figure</title><defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121212"/></marker></defs>';
    const arc = (o, r, a0, a1, color, key, wedge) => {
      const p0 = at(o, r, a0), p1 = at(o, r, a1), big = a1 - a0 > 180 ? 1 : 0;
      const d = 'M' + r1(p0[0]) + ' ' + r1(p0[1]) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + r1(p1[0]) + ' ' + r1(p1[1]);
      const dim = S.focus && S.focus.indexOf(key) < 0 ? ' dim' : '';
      return (wedge ? '<path class="wedge' + dim + '" d="M' + o[0] + ' ' + o[1] + ' L' + r1(p0[0]) + ' ' + r1(p0[1]) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + r1(p1[0]) + ' ' + r1(p1[1]) + ' Z" fill="' + color + '" fill-opacity=".12"/>' : '')
        + '<path class="arc' + dim + '" d="' + d + '" stroke="' + color + '"/>';
    };
    const label = (o, r, a0, a1, color, text, key) => {
      const m = (a0 + a1) / 2, c = Math.cos(rad(m)), s = Math.sin(rad(m));
      const p = at(o, r + (a1 - a0 < 40 ? 30 : 16), m);
      const anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
      const dim = S.focus && S.focus.indexOf(key) < 0 ? ' dim' : '';
      return '<text class="lab' + dim + '" x="' + r1(p[0]) + '" y="' + r1(p[1] + (anchor === 'middle' ? (s > 0 ? -6 : 8) : 0)) + '" fill="' + color + '" text-anchor="' + anchor + '" dominant-baseline="central">' + text + '</text>';
    };
    const line = (p, q, arrows) => '<line class="ln" x1="' + r1(p[0]) + '" y1="' + r1(p[1]) + '" x2="' + r1(q[0]) + '" y2="' + r1(q[1]) + '"' + (arrows ? ' marker-end="url(#arw)"' : '') + '/>';
    const handle = (p, id, color, value, label) => '<g class="handle" tabindex="0" role="slider" aria-label="' + label + '" aria-valuemin="0" aria-valuemax="359" aria-valuenow="' + Math.round(value) + '" data-h="' + id + '" transform="translate(' + r1(p[0]) + ' ' + r1(p[1]) + ')"><circle r="12" fill="' + color + '"/></g>';
    const deg = (n) => Math.round(n) + '°';

    let facts = [], dare = '';
    if (S.mode === 'cross') {
      const g = crossAngles(), a = g.a, b = a + g.one, L = 190;
      const rays = [a, b, a + 180, b + 180];
      rays.forEach((r) => { h += line(O, at(O, L, r), true); });
      h += arc(O, 34, a, b, C.a1, '1', true) + arc(O, 46, b, a + 180, C.a2, '2', true) + arc(O, 34, a + 180, b + 180, C.a1, '3', true) + arc(O, 46, b + 180, a + 360, C.a2, '4', true);
      const hide = S.hide;
      h += label(O, 34, a, b, C.a1, '∠1 = ' + deg(g.one), '1') + label(O, 46, b, a + 180, C.a2, '∠2 = ' + deg(g.two), '2')
        + label(O, 34, a + 180, b + 180, C.a1, '∠3 = ' + (hide ? '?' : deg(g.one)), '3') + label(O, 46, b + 180, a + 360, C.a2, '∠4 = ' + (hide ? '?' : deg(g.two)), '4');
      h += '<circle cx="' + O[0] + '" cy="' + O[1] + '" r="4" fill="#121212"/>';
      h += handle(at(O, 150, a), 'A0', '#121212', a, 'Line one, end one') + handle(at(O, 150, a + 180), 'A1', '#121212', a, 'Line one, end two')
        + handle(at(O, 150, b), 'B0', '#5f5c55', b, 'Line two, end one') + handle(at(O, 150, b + 180), 'B1', '#5f5c55', b, 'Line two, end two');
      const q = hide ? '?' : null;
      facts = [
        { keys: ['1', '2'], name: 'Linear pair', text: '<span class="eq">∠1 + ∠2 = ' + deg(g.one) + ' + ' + deg(g.two) + ' = 180°</span><br>Side by side on a straight line.' },
        { keys: ['2', '3'], name: 'Linear pair', text: '<span class="eq">∠2 + ∠3 = ' + deg(g.two) + ' + ' + (q || deg(g.one)) + ' = 180°</span><br>Another straight line, same deal.' },
        { keys: ['1', '3'], name: 'Vertical angles', text: '<span class="eq">∠1 = ∠3 = ' + deg(g.one) + '</span><br>Across from each other. Both make 180° with ∠2, so they have to match.' },
        { keys: ['2', '4'], name: 'Vertical angles', text: '<span class="eq">∠2 = ∠4 = ' + deg(g.two) + '</span><br>The other pair across from each other.' },
      ];
      dare = '<b>Dare:</b> make ∠1 and ∠3 different sizes. Drag either line anywhere you want. (You can’t — that is what makes vertical angles a rule.)';
    } else if (S.mode === 'right') {
      const V = [150, 340], t = S.right.t, L = 290;
      h += line(V, at(V, L, 0), true) + line(V, at(V, 290, 90), true) + line(V, at(V, L - 20, t), true);
      h += '<path d="M' + (V[0] + 18) + ' ' + V[1] + ' L' + (V[0] + 18) + ' ' + (V[1] - 18) + ' L' + V[0] + ' ' + (V[1] - 18) + '" fill="none" stroke="#121212" stroke-width="2"/>';
      h += arc(V, 70, 0, t, C.a1, '1', true) + arc(V, 86, t, 90, C.a2, '2', true);
      h += label(V, 70, 0, t, C.a1, '∠1 = ' + deg(t), '1') + label(V, 86, t, 90, C.a2, '∠2 = ' + deg(90 - t), '2');
      h += '<circle cx="' + V[0] + '" cy="' + V[1] + '" r="4" fill="#121212"/>' + handle(at(V, 220, t), 'T', C.a3, t, 'The ray inside the right angle');
      facts = [
        { keys: ['1', '2'], name: 'Complementary angles', text: '<span class="eq">∠1 + ∠2 = ' + deg(t) + ' + ' + deg(90 - t) + ' = 90°</span><br>Together they fill the right angle (the little square).' },
      ];
      dare = '<b>Dare:</b> make ∠1 + ∠2 come out to anything other than 90°. The ray can go anywhere inside the corner.';
    } else {
      // rays keep their circular order while dragging, so each dot stays the same ray
      const r = S.around.r, L = 175, cols = [C.a1, C.a2, C.a3, C.a4];
      const spans = r.map((x, i) => norm(r[(i + 1) % r.length] - x) || 360);
      r.forEach((x) => { h += line(O, at(O, L, x), true); });
      r.forEach((x, i) => { h += arc(O, 36 + (i % 2) * 12, x, x + spans[i], cols[i], String(i + 1), true); });
      r.forEach((x, i) => { h += label(O, 36 + (i % 2) * 12, x, x + spans[i], cols[i], '∠' + (i + 1) + ' = ' + deg(spans[i]), String(i + 1)); });
      h += '<circle cx="' + O[0] + '" cy="' + O[1] + '" r="4" fill="#121212"/>';
      r.forEach((x, i) => { h += handle(at(O, 150, x), 'R' + i, '#121212', x, 'Ray ' + (i + 1)); });
      facts = [
        { keys: ['1', '2', '3', '4'], name: 'Around a point', text: '<span class="eq">' + spans.map(deg).join(' + ') + ' = 360°</span><br>All the way around is one full turn.' },
      ];
      dare = '<b>Dare:</b> make the four angles add up to anything but 360°.';
    }
    svg.innerHTML = h;
    factsEl.innerHTML = facts.map((f) => '<button type="button" class="fact" data-keys="' + f.keys.join(',') + '" aria-pressed="' + (S.focus && S.focus.join(',') === f.keys.join(',') ? 'true' : 'false') + '"><span class="nm">' + f.name + '</span>' + f.text + '</button>').join('')
      + '<p class="mute" style="font-size:13.5px;margin:4px 0 0">Tap a fact to light up its angles.</p>';
    dareEl.innerHTML = dare;
    document.getElementById('hide-wrap').hidden = S.mode !== 'cross';
  }

  /* ---------- dragging ---------- */
  let drag = null;
  function toSvg(ev) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [p.x, p.y];
  }
  function angleFrom(o, p) { return norm(Math.round((Math.atan2(-(p[1] - o[1]), p[0] - o[0]) * 180) / Math.PI)); }
  function setHandle(id, ang) {
    if (S.mode === 'cross') {
      const line = id[0] === 'A' ? 'a' : 'b', other = line === 'a' ? 'b' : 'a';
      let v = norm(ang + (id[1] === '1' ? 180 : 0)) % 180;
      const gap = norm(v - (norm(S.cross[other]) % 180)) % 180;
      if (gap < 6 || gap > 174) return; // keep the lines from lying on top of each other
      S.cross[line] = v;
    } else if (S.mode === 'right') {
      S.right.t = Math.max(4, Math.min(86, ang > 270 ? 4 : ang > 180 ? 86 : ang));
    } else {
      const i = Number(id.slice(1)), r = S.around.r.slice();
      const prev = r[(i + r.length - 1) % r.length], next = r[(i + 1) % r.length];
      const lo = norm(ang - prev), hi = norm(next - ang), gap = norm(next - prev) || 360;
      if (lo < 8 || hi < 8 || lo + hi > gap + 0.5) return; // stay between the neighbours
      r[i] = ang; S.around.r = r;
    }
    draw();
  }
  svg.addEventListener('pointerdown', (ev) => {
    const g = ev.target.closest('.handle');
    if (!g) return;
    drag = g.getAttribute('data-h');
    svg.setPointerCapture(ev.pointerId);
    g.classList.add('is-drag');
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const o = S.mode === 'right' ? [150, 340] : O;
    setHandle(drag, angleFrom(o, toSvg(ev)));
    const g = svg.querySelector('[data-h="' + drag + '"]'); if (g) g.classList.add('is-drag');
  });
  const end = () => { if (!drag) return; const id = drag; drag = null; draw(); const g = svg.querySelector('[data-h="' + id + '"]'); if (g) g.focus({ preventScroll: true }); };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('keydown', (ev) => {
    const g = ev.target.closest('.handle');
    if (!g) return;
    const step = ev.shiftKey ? 10 : 1;
    const d = ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' ? step : ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? -step : 0;
    if (!d) return;
    ev.preventDefault();
    const id = g.getAttribute('data-h');
    let cur;
    if (S.mode === 'cross') cur = norm((id[0] === 'A' ? S.cross.a : S.cross.b) + (id[1] === '1' ? 180 : 0));
    else if (S.mode === 'right') cur = S.right.t;
    else cur = S.around.r[Number(id.slice(1))];
    setHandle(id, norm(cur + d));
    const again = svg.querySelector('[data-h="' + id + '"]'); if (again) again.focus({ preventScroll: true });
  });

  /* ---------- controls ---------- */
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    S.mode = b.getAttribute('data-mode'); S.focus = null;
    document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    draw();
  }));
  factsEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('.fact'); if (!b) return;
    const keys = b.getAttribute('data-keys').split(',');
    S.focus = S.focus && S.focus.join(',') === keys.join(',') ? null : keys;
    draw();
  });
  hideEl.addEventListener('change', () => { S.hide = hideEl.checked; draw(); });
  document.getElementById('shuffle').addEventListener('click', () => {
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    if (S.mode === 'cross') { S.cross.a = rnd(0, 40); S.cross.b = S.cross.a + rnd(25, 155); }
    else if (S.mode === 'right') S.right.t = rnd(12, 78);
    else {
      // four angles, each between 40° and 160°, that fill the full turn
      let spans;
      do { spans = [rnd(50, 130), rnd(50, 130), rnd(50, 130)]; spans.push(360 - spans[0] - spans[1] - spans[2]); } while (spans[3] < 40 || spans[3] > 160);
      let x = rnd(0, 40); S.around.r = spans.map((sp) => { const at0 = x; x += sp; return at0 % 360; });
    }
    draw();
  });
  draw();
})();
</script>
</body>
</html>
