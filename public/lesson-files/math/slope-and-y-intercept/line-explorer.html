<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Line explorer — y = mx + b</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="/lesson-kit/lesson.css" />
<style>
  body { padding: 0; }
  .wrap { padding: 16px; max-width: none; }
  .lay { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, .8fr); gap: 16px; align-items: start; }
  canvas { width: 100%; height: auto; display: block; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; touch-action: none; }
  .eq { font: 900 clamp(26px, 4vw, 38px)/1 var(--font-display); letter-spacing: -.02em; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .eq .m { color: #b5471f; } .eq .b { color: #1f4fb5; }
  .sl { margin: 0 0 12px; }
  .sl label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .sl b { font-family: var(--font-mono); }
  .sl.m input { accent-color: #b5471f; } .sl.b input { accent-color: #1f4fb5; }
  .tbl td, .tbl th { padding: 6px 10px; }
  .tbl { font-size: 14px; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .tbl td.d { color: #b5471f; font-family: var(--font-mono); font-size: 12.5px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  @media (max-width: 640px) { .lay { grid-template-columns: 1fr; } }
</style>
</head>
<body class="math">
<div class="wrap">
  <div class="lay">
    <div>
      <canvas id="c" width="720" height="560" aria-label="Graph of the line"></canvas>
      <p class="mute" style="font-size:13px;margin:8px 0 0">Drag the <span style="color:#1f4fb5;font-weight:600">blue dot</span> to move <b>b</b>. Drag the <span style="color:#b5471f;font-weight:600">orange dot</span> to change <b>m</b>. The triangle shows one step right (run 1) and the rise that goes with it.</p>
    </div>
    <div>
      <div class="eq">y = <span class="m" id="mv">1</span>x <span id="sign">+</span> <span class="b" id="bv">0</span></div>
      <div class="sl m"><label><span>slope <b>m</b></span><b id="ml">1</b></label><input class="range" type="range" id="m" min="-5" max="5" step="0.5" value="1" /></div>
      <div class="sl b"><label><span>y-intercept <b>b</b></span><b id="bl">0</b></label><input class="range" type="range" id="b" min="-8" max="8" step="1" value="0" /></div>
      <div class="chips">
        <button class="btn sm" data-m="1" data-b="0">y = x</button>
        <button class="btn sm" data-m="2" data-b="-3">y = 2x − 3</button>
        <button class="btn sm" data-m="-0.5" data-b="4">y = −½x + 4</button>
        <button class="btn sm" data-m="0" data-b="2">y = 2</button>
      </div>
      <table class="tbl" id="tbl"></table>
    </div>
  </div>
</div>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, U = 40;            // pixels per unit
  const ox = W / 2, oy = H / 2;                        // origin
  let m = 1, b = 0, drag = null;
  const $ = (id) => document.getElementById(id);
  const toPx = (x, y) => [ox + x * U, oy - y * U];
  const toUnit = (px, py) => [(px - ox) / U, (oy - py) / U];
  const fmt = (v) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100));

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // grid
    ctx.strokeStyle = '#e4e1d8'; ctx.lineWidth = 1;
    for (let x = ox % U; x < W; x += U) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = oy % U; y < H; y += U) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // axes
    ctx.strokeStyle = '#121212'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
    ctx.fillStyle = '#5f5c55'; ctx.font = '11px JetBrains Mono, monospace'; ctx.textAlign = 'center';
    for (let x = -8; x <= 8; x++) if (x) ctx.fillText(x, ox + x * U, oy + 14);
    ctx.textAlign = 'right';
    for (let y = -6; y <= 6; y++) if (y) ctx.fillText(y, ox - 5, oy - y * U + 4);
    // line
    const [x1, y1] = toPx(-10, m * -10 + b), [x2, y2] = toPx(10, m * 10 + b);
    ctx.strokeStyle = '#121212'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // rise/run triangle from (1, m+b) to (2, 2m+b)
    const [ax, ay] = toPx(1, m + b), [bx, by] = toPx(2, m + b), [cx, cy] = toPx(2, 2 * m + b);
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#b5471f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#b5471f'; ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('run 1', (ax + bx) / 2, by + (m >= 0 ? 16 : -8));
    ctx.textAlign = 'left'; ctx.fillText('rise ' + fmt(m), bx + 6, (by + cy) / 2 + 4);
    // handles
    const [hx, hy] = toPx(0, b);
    ctx.fillStyle = '#1f4fb5'; ctx.beginPath(); ctx.arc(hx, hy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#b5471f'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 3.5, 0, 7); ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill();
    // readouts
    $('mv').textContent = fmt(m); $('ml').textContent = fmt(m);
    $('sign').textContent = b < 0 ? '−' : '+'; $('bv').textContent = fmt(Math.abs(b)); $('bl').textContent = fmt(b);
    $('m').value = m; $('b').value = b;
    let rows = '<tr><th>x</th><th>y</th><th>change</th></tr>';
    for (let x = 0; x <= 4; x++) rows += `<tr><td class="num">${x}</td><td class="num">${fmt(m * x + b)}</td><td class="d">${x ? (m >= 0 ? '+' : '') + fmt(m) : 'b = ' + fmt(b)}</td></tr>`;
    $('tbl').innerHTML = rows;
  }
  $('m').oninput = (e) => { m = Number(e.target.value); draw(); };
  $('b').oninput = (e) => { b = Number(e.target.value); draw(); };
  document.querySelectorAll('[data-m]').forEach((c) => { c.onclick = () => { m = Number(c.dataset.m); b = Number(c.dataset.b); draw(); }; });

  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  cv.addEventListener('pointerdown', (e) => {
    const [px, py] = pos(e);
    const [hx, hy] = toPx(0, b), [cx, cy] = toPx(2, 2 * m + b);
    if (Math.hypot(px - hx, py - hy) < 18) drag = 'b';
    else if (Math.hypot(px - cx, py - cy) < 18) drag = 'm';
    if (drag) cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const [, y] = toUnit(...pos(e));
    if (drag === 'b') b = Math.max(-8, Math.min(8, Math.round(y)));
    else m = Math.max(-5, Math.min(5, Math.round((y - b) / 2 * 2) / 2));
    draw();
  });
  cv.addEventListener('pointerup', () => { drag = null; });
  draw();
</script>
</body>
</html>
