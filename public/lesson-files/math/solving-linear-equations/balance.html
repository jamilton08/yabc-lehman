<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balance scale — solving equations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="/lesson-kit/lesson.css" />
<style>
  .eq { font: 900 clamp(30px, 5vw, 48px)/1 var(--font-display); letter-spacing: -.02em; text-align: center; margin: 6px 0 18px; font-variant-numeric: tabular-nums; }
  .eq .x { color: var(--acc); }
  .scale { position: relative; height: 260px; margin: 0 auto 8px; max-width: 760px; }
  .beam { position: absolute; left: 50%; top: 40px; width: 80%; height: 8px; background: var(--ink); border-radius: 4px; transform-origin: center; transform: translateX(-50%) rotate(var(--tilt, 0deg)); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .post { position: absolute; left: 50%; top: 44px; width: 10px; height: 190px; background: var(--ink); transform: translateX(-50%); }
  .base { position: absolute; left: 50%; bottom: 0; width: 160px; height: 14px; background: var(--ink); transform: translateX(-50%); border-radius: 4px; }
  .pan { position: absolute; top: 48px; width: 42%; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-end; justify-content: center; min-height: 140px; padding: 8px; border-bottom: 6px solid var(--ink); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .pan.l { left: 8%; transform: translateY(calc(var(--dl, 0) * 1px)); }
  .pan.r { right: 8%; transform: translateY(calc(var(--dr, 0) * 1px)); }
  .blk { display: grid; place-items: center; width: 40px; height: 40px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; font: 700 15px var(--font-display); }
  .blk.x { background: var(--acc); color: #fff; border-color: var(--acc); }
  .blk.neg { background: var(--paper-2); color: var(--ink); border-style: dashed; }
  .blk.negx { background: #fff; color: var(--acc); border-color: var(--acc); border-style: dashed; }
  .blk.many { width: auto; padding: 0 12px; }
  .ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .ctrl { background: #fff; border: 1.5px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
  .ctrl h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  .ctrl .row { gap: 8px; }
  .ctrl input { width: 70px; }
  .hist { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-family: var(--font-mono); font-size: 14px; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .hist li span:last-child { color: var(--mute); }
  .win { border-color: var(--ok); box-shadow: 6px 6px 0 var(--ok); }
</style>
</head>
<body class="math">
<div class="wrap">
  <p class="kicker">Math · Equations · Interactive</p>
  <h1>The balance scale</h1>
  <p class="lede">Both pans weigh the same — that is what the equals sign means. Do the same thing to both pans and it stays level. Get <b>x</b> alone on one pan and you have solved it.</p>

  <div class="card pop" id="board">
    <div class="eq" id="eq"></div>
    <div class="scale" id="scale">
      <div class="beam" id="beam"></div>
      <div class="post"></div>
      <div class="pan l" id="panL"></div>
      <div class="pan r" id="panR"></div>
      <div class="base"></div>
    </div>
    <p class="mute" id="msg" style="text-align:center;margin:0;min-height:1.5em"></p>
  </div>

  <div class="ctrls">
    <div class="ctrl">
      <h3>Add or subtract a number</h3>
      <div class="row"><input type="number" id="n" value="3" /><button class="btn sm ink" id="add">+ both sides</button><button class="btn sm" id="sub">− both sides</button></div>
    </div>
    <div class="ctrl">
      <h3>Add or subtract x's</h3>
      <div class="row"><input type="number" id="nx" value="1" /><button class="btn sm ink" id="addx">+ x's both sides</button><button class="btn sm" id="subx">− x's both sides</button></div>
    </div>
    <div class="ctrl">
      <h3>Divide both sides</h3>
      <div class="row"><input type="number" id="d" value="2" /><button class="btn sm ink" id="div">÷ both sides</button></div>
    </div>
    <div class="ctrl">
      <h3>New equation</h3>
      <div class="row"><button class="btn sm" data-eq="2,3,0,11">2x + 3 = 11</button><button class="btn sm" data-eq="7,-4,3,12">7x − 4 = 3x + 12</button><button class="btn sm" data-eq="-4,-7,0,13">−4x − 7 = 13</button><button class="btn sm" id="rand">Random</button></div>
    </div>
  </div>

  <ol class="hist" id="hist"></ol>
</div>

<script>
  // The equation is  a·x + b  =  c·x + d   (each side: x-count, number)
  let L = { x: 2, n: 3 }, R = { x: 0, n: 11 };
  let solution = 4, history = [];
  const $ = (id) => document.getElementById(id);

  const side = (s) => {
    const xs = s.x === 0 ? '' : (s.x === 1 ? 'x' : s.x === -1 ? '−x' : `${s.x < 0 ? '−' : ''}${Math.abs(s.x)}x`);
    const ns = s.n === 0 ? '' : (xs ? ` ${s.n < 0 ? '−' : '+'} ${Math.abs(s.n)}` : `${s.n < 0 ? '−' : ''}${Math.abs(s.n)}`);
    return (xs + ns) || '0';
  };
  const fmt = (s) => side(s).replace(/(\d*)x/g, '$1<span class="x">x</span>');

  function blocks(s) {
    let h = '';
    const ax = Math.abs(s.x), an = Math.abs(s.n);
    if (ax > 6) h += `<div class="blk x ${s.x < 0 ? 'negx' : ''} many">${s.x}x</div>`;
    else for (let i = 0; i < ax; i++) h += `<div class="blk ${s.x < 0 ? 'negx' : 'x'}">${s.x < 0 ? '−x' : 'x'}</div>`;
    if (an > 8) h += `<div class="blk ${s.n < 0 ? 'neg' : ''} many">${s.n}</div>`;
    else for (let i = 0; i < an; i++) h += `<div class="blk ${s.n < 0 ? 'neg' : ''}">${s.n < 0 ? '−1' : '1'}</div>`;
    return h || '<div class="blk" style="border-style:dashed;color:var(--mute)">0</div>';
  }

  function render(note) {
    $('eq').innerHTML = `${fmt(L)} &nbsp;=&nbsp; ${fmt(R)}`;
    $('panL').innerHTML = blocks(L);
    $('panR').innerHTML = blocks(R);
    // weight = value at the true solution; both sides always equal, so the beam stays level
    $('beam').style.setProperty('--tilt', '0deg');
    const solved = (L.x === 1 && R.x === 0) || (R.x === 1 && L.x === 0);
    const done = solved && ((L.x === 1 && L.n === 0) || (R.x === 1 && R.n === 0));
    $('board').classList.toggle('win', done);
    $('msg').textContent = done ? `Solved: x = ${L.x === 1 ? R.n : L.n}. Check it in the original equation.` : (note || 'Level. Both sides are still equal.');
    $('hist').innerHTML = history.map((h) => `<li><span>${h.eq}</span><span>${h.op}</span></li>`).join('');
  }

  function apply(op, f) {
    f();
    history.push({ eq: `${side(L)} = ${side(R)}`, op });
    render(op);
  }
  const num = (id) => Number($(id).value) || 0;
  $('add').onclick = () => apply(`+ ${num('n')} to both sides`, () => { L.n += num('n'); R.n += num('n'); });
  $('sub').onclick = () => apply(`− ${num('n')} from both sides`, () => { L.n -= num('n'); R.n -= num('n'); });
  $('addx').onclick = () => apply(`+ ${num('nx')}x to both sides`, () => { L.x += num('nx'); R.x += num('nx'); });
  $('subx').onclick = () => apply(`− ${num('nx')}x from both sides`, () => { L.x -= num('nx'); R.x -= num('nx'); });
  $('div').onclick = () => {
    const d = num('d');
    if (!d) return;
    if ([L.x, L.n, R.x, R.n].some((v) => v % d !== 0)) { $('msg').textContent = `Dividing by ${d} would leave fractions. Try a number that divides every term (or add/subtract first).`; return; }
    apply(`÷ both sides by ${d}`, () => { L.x /= d; L.n /= d; R.x /= d; R.n /= d; });
  };
  function load(a, b, c, d) { L = { x: a, n: b }; R = { x: c, n: d }; history = []; render(); }
  document.querySelectorAll('[data-eq]').forEach((b) => { b.onclick = () => load(...b.dataset.eq.split(',').map(Number)); });
  $('rand').onclick = () => {
    const x = Math.floor(Math.random() * 13) - 6;             // the answer
    const a = [2, 3, 4, 5][Math.floor(Math.random() * 4)], c = Math.random() < .5 ? 0 : Math.floor(Math.random() * 3) + 1;
    const b = Math.floor(Math.random() * 15) - 7;
    const d = a * x + b - c * x;                                 // makes both sides equal at x
    load(a, b, c, d);
  };
  load(2, 3, 0, 11);
</script>
</body>
</html>
